<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/analytics.css">
</head>
<body>
    <div id="header"></div>

    <main>
<!--This is the analytics page-->
        <h1>Analytics</h1>
<!--This area shows the headline statics to provide a quick summary to the vendor-->
        <div class="analytics-outline">
            <div class="summary-box">
                <p class="summary-title">Bundles Collected</p>
                <p class="summary-number" id="bundlesCollected">-</p>
            </div>

            <div class="summary-box">
                <p class="summary-title">Bundle No Shows</p>
                <p class="summary-number" id="bundleNoShow">-</p>
            </div>

            <div class="summary-box">
                <p class="summary-title">Bundles Expired</p>
                <p class="summary-number" id="bundlesExpired">-</p>
            </div>

        <div class="summary-box">
            <p class="summary-title">Waste Saved</p>
            <p class="summary-number" id="wasteSaved">-</p>
        </div>

            <div class="summary-box">
                <p class="summary-title">Average Weight</p>
                <p class="summary-number" id="averageWeight">-</p>
            </div>

        <div class="drop-down">
            <div class="dropdown-wrapper">
                <label for="period-dropdown">Select time Period:</label>
                <select id="period-dropdown" aria-label="Select Time Period">
                    <option value="day">Day</option>
                    <option value="week">Week</option>
                    <option value="month">Month</option>
                    <option value="year" selected>Year</option> </select>
            </div>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-wrapper">
            <canvas id="pie-chart" role="img" aria-label="Pie chart showing bundle outcomes"></canvas>
        </div>
        <div class="chart-wrapper line-chart-wrapper">
            <canvas id="line-graph" role="img" aria-label="Line graph showing bundle activity over time"></canvas>
        </div>
            <div class="chart-wrapper bar-chart-wrapper">
            <canvas id="bar-chart" role="img" aria-label="Bar chart showing collection proportion by discount"></canvas>
        </div>
    </div>

    <div class="analytics-display">
        <div class="collected">
            <h1>Bundles Collected</h1>
            <p id="collected-money"></p>
            <table class="analytics-table">
                <thead>
                <tr>
                    <th>Bundle Name</th>
                    <th>Date</th>
                    <th>Price</th>
                </tr>
                </thead>
                <tbody id="collected-table"></tbody>
            </table>
        </div>

        <div class="no-shows">
            <h1>Bundle No Shows</h1>
            <p id="noshow-money"></p>
            <table class="analytics-table">
                <thead>
                <tr>
                    <th>Bundle Name</th>
                    <th>Date</th>
                    <th>Price</th>
                </tr>
                </thead>
                <tbody id="noshows-table"></tbody>
            </table>
        </div>

        <div class="expired">
            <h1>Bundles Expired</h1>
            <p id="expired-money"></p>
            <table class="analytics-table">
                <thead>
                <tr>
                    <th>Bundle Name</th>
                    <th>Date</th>
                    <th>Price</th>
                </tr>
                </thead>
                <tbody id="expired-table"></tbody>
            </table>
        </div>
    </div>
</main>

    <div id="footer"></div>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/vendorHeaderFooter.js"></script>
    <script type="module" src="js/analytics.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</body>
</html>
