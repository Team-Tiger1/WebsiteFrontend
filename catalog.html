<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>The Last Fork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/headerFooter.css"/>
    <link rel="stylesheet" href="css/catalog.css"/>
</head>
<body class="catalog-page">

<!--Header-->
<div id="header"></div>
<div class="pageWrap">
<!--Carousel holds all companies which are clickable to access company page-->
 <h2>Companies</h2>
    <div class="carrousel" id="vendorCarousel">
    <!-- will be populated by the backend-->
    </div>
<section class="streakBanner">
    <div class="streak-card">
        <p class="streakHeader">Your current food saved streak is</p>
        <p class="streak">0 weeks!</p>
    </div>
</section>

<h2>Bundles</h2>
    <div class="search-bar">
        <input type="text" id="bundleSearch" placeholder="Search bundles" aria-label="Search Bundles">
    </div>

    <div class="advanced-filters">
        <div class="form-group">
            <label for="filterFrom">From</label>
            <input type="datetime-local" id="filterFrom" aria-label="Filter From Date">
        </div>
        <div class="form-group">
            <label for="filterTill">Till</label>
            <input type="datetime-local" id="filterTill" aria-label="Filter Till Date">
        </div>
        <div class="form-group">
            <label for="postcodeFilter">PostCode</label>
            <input type="text" id="postcodeFilter" placeholder="e.g. EX or EX4" aria-label="Filter by Postcode" maxlength="3">
        </div>
    </div>
<!--Add filter for each category-->
<div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-category="ALL">All</button>
    <button class="filter-btn" data-category="BREAD_BAKED_GOODS">Bread & Baked Goods</button>
    <button class="filter-btn" data-category="SWEET_TREATS_DESSERTS">Sweet Treats</button>
    <button class="filter-btn" data-category="MEAT_PROTEIN">Meat</button>
    <button class="filter-btn" data-category="FRUIT_VEGETABLES">Fruit & Veg</button>
    <button class="filter-btn" data-category="DAIRY_EGGS">Dairy & Eggs</button>
    <button class="filter-btn" data-category="READY_MEALS_HOT_FOOD">Ready Meals</button>
    <button class="filter-btn" data-category="SNACKS_SAVOURY_ITEMS">Snacks</button>
    <button class="filter-btn" data-category="BREAKFAST_ITEMS">Breakfast</button>
    <button class="filter-btn" data-category="VEGAN_VEGETARIAN">Vegan & Vegetarian</button>
    <button class="filter-btn" data-category="DRINKS_BEVERAGES">Drinks</button>
</div>
<div id="bundleCarousel" class="bundle-carousel">
    <!-- will be populated by the backend-->
</div>

<h2>Bundles By Company</h2>
<div id="companyBundles">
    <!-- will be populated by the backend-->
    <p id="msg"></p>
</div>

<!--reserve popup-->
<dialog id="reservePopup">
    <h3>Confirm Reservation</h3>
    <p id="reserveDetails"></p>
    <div class="reservationBtn">
        <button id="confirmReserveBtn">Confirm</button>
        <button id="cancelReserveBtn">Cancel</button>
    </div>
</dialog>

<!--reminder popup-->
<dialog id="reminderPopup">
    <h3 id="reminderHeading"></h3>
    <p id="reminderDetails"></p>
    <button id="reminderClose">Close</button>
</dialog>

</div>
<!--Footer-->
<div id="footer"></div>

<script type="module" src="js/script.js"></script>
<script type="module" src="js/catalog.js"></script>
<script type="module" src="js/userHeaderFooter.js"></script>
</body>
</html>
