    <main class="dashboard">
        <header class="dashboard-header"> 
            <h2>Supplier Dashboard</h2>
            <p class="text-muted">
                Overview of today's bundles and pickups.
            </p>
        </header>

        <!--summary boxes-->
        <section class="summary-boxes"> 
            <div class="summary-box">
                <p class="summary-title">Bundles Posted</p>
                <p class="summary-number" id="postedCount"></p>
            </div>

            <div class="summary-box">
                <p class="summary-title">Bundles Reserved</p>
                <p class="summary-number" id="reservedCount">y</p>
            </div>

            <div class="summary-box">
                <p class="summary-title">Pickups Today</p>
                <p class="summary-number" id="pickupCount">z</p>
            </div>


        </section>
        <!--recent reservations with the window and status  -->
        <section class="dashboard-reseverations">
            <h3> Active Reservation</h3>

            <table class="reservation-table">
                <thead>
                    <tr>
                        <th>Bundle Name </th>
                        <th>Pickup Window</th>
                        <th>Price</th>
                        
                    </tr>
                </thead>

                <tbody id="reservations">
                <!--rows will be added in js   -->
                </tbody>
            </table>

            <div class="claim-bar">
                <input id="claimCodeInput" type="text" placeholder="Enter claim code" />
                <button id="claimCodeBtn" class="primary-btn" type="button">Complete</button>
            </div>
            <p id="claimMsg" class="text-muted"></p>
        </section>

        <div id="claimModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modalTitle">Reservation Found</h3>
                <p id="modalBody"></p>
                <button id="modalClose" class="primary-btn" type="button">Close</button>
            </div>
        </div>

    </main>

    <div id="footer"></div>

    <script type="module" src="js/vendorHeaderFooter.js"></script>
