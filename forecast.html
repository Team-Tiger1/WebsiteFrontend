<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>The Last Fork</title>
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/headerFooter.css"/>
    <link rel="stylesheet" href="css/forecast.css"/>
</head>
<body>
<div id="header"></div>

<main class="dashboard">

    <!--  Information explaining the web page purpose  -->
    <header class="dashboard-header">
        <h2>Production Forecast & Advice</h2>
        <p class="text-muted">
            This page will support you in reducing your waste based upon your bundle postings over the last 3 months.
        </p>
    </header>

    <!-- Filter buttons to filter by day -->
    <div class="advanced-filters">
        <button class="filter-btn" data-day="ALL">All Days</button>
        <button class="filter-btn" data-day="Monday">Monday</button>
        <button class="filter-btn" data-day="Tuesday">Tuesday</button>
        <button class="filter-btn" data-day="Wednesday">Wednesday</button>
        <button class="filter-btn" data-day="Thursday">Thursday</button>
        <button class="filter-btn" data-day="Friday">Friday</button>
        <button class="filter-btn" data-day="Saturday">Saturday</button>
        <button class="filter-btn" data-day="Sunday">Sunday</button>
    </div>

    <section class="summary-boxes" id="adviceContainer">
        <p id="loadingMsg">Analysing...</p>
    </section>

</main>

<div id="footer"></div>

<script type="module" src="js/vendorHeaderFooter.js"></script>
<script type="module" src="js/forecast.js"></script>
</body>
</html>
