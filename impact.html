<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Last Fork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/headerFooter.css" />
    <link rel="stylesheet" href="css/impact.css" />
</head>
<body class="impact-page">
<!--Header-->
<div id="header"></div>
<div class="pageWrap">
    <main>
        <!--Where we will display the badge information-->
        <h1>Your Badges</h1>
        <section class="badges" id="badges" aria-label="Your Badges">
            <!--Added by js-->
        </section>

        <!--Leaderboard-->
        <h1>Leaderboard</h1>
        <!-- money leaderboard -->
        <section aria-labelledby="moneyLeaderboardTitle">
            <h3 id="moneyLeaderboardTitle">Money Saved Leaderboard</h3>
            <div id="moneyLeaderboardList"></div>
            <div id="moneyUserPosition"></div>
        </section>
        <!-- waste leaderboard -->
        <section aria-labelledby="wasteLeaderboardTitle">
            <h3 id="wasteLeaderboardTitle">Waste Saved Leaderboard</h3>
            <div id="wasteLeaderboardList"></div>
            <div id="wasteUserPosition"></div>
        </section>

        <h1>Impact Statistics</h1>
        <section aria-labelledby="impactStatsTitle">
            <div class="impact-period-select">
                <!--Select time range for impact info-->
                <label for="impactPeriod">Time Period:</label>
                <select id="impactPeriod">
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                    <option value="year">This Year</option>
                    <option value="all">All Time</option>
                </select>
            </div>
            <!--Statistics based off imapct period-->
            <div class="impact-stats" id="impactStats">
                <!--Money-->
                <div class="impact-card">
                    <p class="impact-label">Money Saved</p>
                    <p class="impact-value" id="impactMoney">-</p>
                </div>
                <!--Waste Saved-->
                <div class="impact-card">
                    <p class="impact-label">Waste Saved</p>
                    <p class="impact-value" id="impactWaste">-</p>
                </div>
                <!--Total Orders-->
                <div class="impact-card">
                    <p class="impact-label">Total Orders</p>
                    <p class="impact-value" id="impactOrders">-</p>
                </div>
            </div>
            <!--error Msg-->
            <p id="impactMsg"></p>
        </section>
    </main>
</div>
<!--Footer-->
<div id="footer"></div>

<script type="module" src="js/script.js"></script>
<script type="module" src="js/userHeaderFooter.js"></script>
<script type="module" src="js/impact.js"></script>
</body>
</html>
