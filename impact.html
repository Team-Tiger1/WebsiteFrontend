<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>The Last Fork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/headerFooter.css" />
    <link rel="stylesheet" href="css/impact.css" />
</head>
<body class="impact-page">
<!--Header-->
<div id="header"></div>
<div class="pageWrap">
    <main>
        <!--Where we will display the badge information-->
        <div class="badge-box">
            <p class="section-label">My Badges</p>
            <div class="badge-grid" id="badgeGrid">
                <!--badges added in from JS response-->
            </div>
        </div>

        <div class="stats-box" id="statsBox">
            <div class="stats-header">
                <div class="stats-badge-icon" id="statIcon"></div>
            </div>
            <div>
                <div class="stats-badge-name" id="statName"></div>
                <div class="stats-badge-grade" id="statGrade"></div>
            </div>
        </div>
        <div id="statSkills"></div>
</div>
</main>
</div>
<!--Footer-->
<div id="footer"></div>

<script type="module" src="js/script.js"></script>
<script type="module" src="js/userHeaderFooter.js"></script>
<script type="module" src="js/impact.js"></script>
</body>
</html>
