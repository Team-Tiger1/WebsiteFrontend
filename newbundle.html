<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/newbundle.css">
</head>
<body>
   <div id="header"></div>

    <main class="dashboard">
        <header class="dashboard-header">
            <h2>Create Bundle</h2>
            <p class="text-muted spacing">Build a bundle from your products</p>
        </header>

        <section class="create-products">

            <form class="product-form" id="createBundleForm">
                <div class="bundle-layout">
                    <!-- left side of new bundles page  -->
                    <div class="bundle-left">
                        <div class="form-group">
                            <label for="bundleName">Bundle Name</label>
                            <input
                                    type="text"
                                    id="bundleName"
                                    placeholder="Enter Bundle Name Here"
                                    aria-label="Enter Bundle Name"
                                    required>
                        </div>

                        <div class="form-group">
                            <label for="bundleDescription">Description</label>
                            <textarea
                                    id="bundleDescription"
                                    rows="3"
                                    placeholder="Extra details for customers"
                                    aria-label="Extra bundle description"
                                    required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="bundleCategory">Category</label>
                            <select id="bundleCategory" aria-label="Select bundle category" required>
                                <option value="" selected disabled>Select bundle category</option>
                                <option value="BREAD_BAKED_GOODS">Bread Baked Goods</option>
                                <option value="SWEET_TREATS_DESSERTS">Sweet Treats Dessert</option>
                                <option value="MEAT_PROTEIN">Meat Protein</option>
                                <option value="FRUIT_VEGETABLES">Fruit and Vegetables</option>
                                <option value="DAIRY_EGGS">Dairy Eggs</option>
                                <option value="READY_MEALS_HOT_FOOD">Ready Meals (Hot Food)</option>
                                <option value="SNACKS_SAVOURY_ITEMS">Savoury Snacks Items</option>
                                <option value="BREAKFAST_ITEMS">Breakfast Items</option>
                                <option value="VEGAN_VEGETARIAN">Vegan and Vegetarian</option>
                                <option value="DRINKS_BEVERAGES">Drinks Beverages</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="bundlePrice">Bundle Price</label>
                            <input
                                    type="number"
                                    id="bundlePrice"
                                    step="0.01"
                                    min="0"
                                    placeholder="How much customers pay"
                                    aria-label="Enter Bundle Price here"
                                    required>
                        </div>

                        <div class="form-group">
                            <label for="collectionStart">Collection Start</label>
                            <input
                                    type="datetime-local"
                                    id="collectionStart"
                                    aria-label="Enter Collection Start date"
                                    required>
                        </div>

                        <div class="form-group">
                            <label for="collectionEnd">Collection End</label>
                            <input
                                    type="datetime-local"
                                    id="collectionEnd"
                                    aria-label="Select collection end time"
                                    required>
                        </div>

                        <div class="bundle-actions">
                            <p class="optimise-label">Need help choosing the best price and collection window?</p>
                            <button type="button" id="optimiseBtn" class="secondary-btn">
                                Optimise bundle
                            </button>
                            <!--this message will show loading text, error text and explanation-->
                            <p id="optimiseMsg" class="text-muted"></p>

                            <a href="simulate.html" id="forecastLearnMore" class="learn-more-link">
                                Learn more
                            </a>
                            <br>


                            <button type="submit" class="primary-btn">
                                Create Bundle
                            </button>

                            <p id="bundleMsg" class="text-muted"></p>
                        </div>
                    </div>

                    <!-- right side of new bundles-->
                    <aside class="bundle-right">
                        <div class="products-panel">
                            <div class="products-panel-header">
                                <h3>Your products</h3>
                                <p class="text-muted">Search and add quantities of products </p>
                            </div>

                            <div class="product-search-wrap">
                                <input
                                        type="search"
                                        id="productSearch"
                                        placeholder="Search for a product"
                                        aria-label="Search for a product">
                            </div>

                            <p id="productsSummary" class="products-summary text-muted">
                                Loading products...
                            </p>

                            <div id="productsList" class="products-scroll-list">
                                <p class="text-muted">Select the products you want in the bundle</p>
                            </div>
                        </div>
                    </aside>
                </div>
            </form>

        <dialog id="successPopup" class="custom-popup">
            <h3>Success!</h3>
            <p>Your bundle has been successfully created.</p>
            <div class="popupBtnWrap">
                <button type="button" id="closePopupBtn" class="primary-btn">OK</button>
            </div>
        </dialog>

    </section>
</main>



    <div id="footer"></div>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/vendorHeaderFooter.js"></script>
    <script type="module" src="js/newbundle.js"></script>
</body>
</html>
