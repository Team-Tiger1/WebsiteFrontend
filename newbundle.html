<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/headerFooter.css">
</head>
<body>
   <div id="header"></div>

    <main class="dashboard">
        <header class="dashboard-header">
            <h2>Create Bundle</h2>
            <p class="text-muted">Build a bundel from your products</p>
        </header>

        <section class="create-products">
            <h3>Add a new bundle</h3>

            <form class="product-form" id="createBundleForm">
                <!-- bundle name -->
                <div class="form-group">
                    <label for="bundleName">Bundle Name</label>
                    <input
                        type="text"
                        id="bundleName"
                        placeholder="Enter Bundle Name Here"
                        required>
                </div>
                <!-- description -->
                 <div class="form-group">
                    <label for="bundleDescription">Description</label>
                    <textarea
                        id="bundleDescription"
                        rows="3"
                        placeholder="notes for customers"
                        required></textarea>
                </div>
                <!-- price users will pay -->
                <div class="form-group">
                    <label for="bundlePrice">Bundle Price</label>
                    <input
                        type="number"
                        id="bundlePrice"
                        step="0.01"
                        min="0"
                        placeholder="how much customers pay"
                        required>
                </div>

                <!-- category -->
                 <div class="form-group">
                    <label for="bundleCategory">Category</label>
                    <select id="bundleCategory" required>
                        <option value="">Select…</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Breakfast Bar">Breakfast Bar</option>
                        <option value="Cafe">Cafe</option>
                        <option value="Dessert Shop">Dessert Shop</option>
                        <option value="Fast Food">Fast Food</option>
                        <option value="Restaurant">Restaurant</option>
                        <option value="Smoothie Bar">Smoothie Bar</option>
                        <option value="Supermarket">Supermarket</option>
                    </select>
                </div>

                <!-- start time for customer collection  -->
                <div class="form-group">
                    <label for="collectionStart">Collection Start</label>
                    <input type="datetime-local" id="collectionStart" 
                    required>
                </div>
                <!-- end time  -->
                <div class="form-group">
                    <label for="collectionEnd">Collection End</label>
                    <input type="datetime-local" id="collectionEnd" required>
                </div>

                <!-- list of products  -->
                <div class="form-group">
                    <label>Your products</label>

                    
                    <div id="productsList" class="checkbox-grid">
                        <p class="text-muted">select the products you want in the bundle</p>
                    </div>
                </div>

                <!-- create bundle button  -->
                <button type="submit" class="primary-btn">
                    Create bundle
                </button>

                <!-- error message -->
                <p id="bundleMsg" class="text-muted"></p>

            </form>

        
    </main>


    <div id="footer"></div>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/vendorHeaderFooter.js"></script>
    <script type="module" src="js/newbundle.js"></script>
</body>
</html>
