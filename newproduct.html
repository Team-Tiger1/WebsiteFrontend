<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/newproduct.css">
</head>
<body>
    <div id="header"></div>

    <main class="dashboard">
        <header class="dashboard-header"> 
            <h2>Create Products</h2>
            <p class="text-muted">
                Add a new product to your catalogue.
            </p>
        </header>

        
        <section class="create-products">
            <h3>Add new product</h3>

            <form class="product-form" id="createProductForm">

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text"
                    id="productName"
                    name="name"
                    placeholder="Enter product here"
                    required>
                </div>

                <div class="form-group">
                    <label for="retailPrice">Retail Price</label>
                    <input
                        type="number"
                        id="retailPrice"
                        name="retailPrice"
                        placeholder="Enter price here"
                        step="0.01"
                        required>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (KG) </label>
                    <input 
                        type="number"
                        id="weight"
                        name = "weight" 
                        placeholder="Enter weight here"
                        step="0.01"
                        required>
                </div>

                <div class="form-goup">
                    <lable>Allergies (select any that apply)</lable>
                    <div class="allergy-grid">
                        <label><input type="checkbox" name="allergies" value="GLUTEN"> Gluten</label>
                        <label><input type="checkbox" name="allergies" value="DAIRY"> Dairy</label>
                        <label><input type="checkbox" name="allergies" value="NUTS"> Nuts</label>
                        <label><input type="checkbox" name="allergies" value="EGGS"> Eggs</label>
                        <label><input type="checkbox" name="allergies" value="FISH"> Fish</label>
                        <label><input type="checkbox" name="allergies" value="PEANUTS"> Peanuts</label>
                        <label><input type="checkbox" name="allergies" value="VEGAN"> Vegan</label>
                        <label><input type="checkbox" name="allergies" value="VEGETARIAN"> Vegetarian</label>

                    </div>
                </div>
                



                <button type="submit" class="primary-btn">create product</button>
                <p id="productMsg" class="text-muted"></p>
                

            </form>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="js/vendorHeaderFooter.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/newproduct.js"></script>
    <script type="module" src="js/newproduct.js"></script>
    

</body>
</html>
