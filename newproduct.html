<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/newproduct.css">
</head>
<body>
    <div id="header"></div>

    <main class="dashboard">
        <header class="dashboard-header"> 
            <h2>Create Product</h2>
            
        </header>

        
        <section class="create-products">

            <form class="product-form" id="createProductForm">

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text"
                    id="productName"
                    name="name"
                    placeholder="Enter product here"
                    aria-label="Enter product name"
                    required>
                </div>

                <div class="form-group">
                    <label for="retailPrice">Retail Price</label>
                    <input
                        type="number"
                        id="retailPrice"
                        name="retailPrice"
                        placeholder="Enter price here"
                        step="0.01"
                        aria-label="Enter retail price here"
                        required>
                </div>

                <div class="form-group">
                    <label for="weight">Weight (g) </label>
                    <input 
                        type="number"
                        id="weight"
                        name = "weight" 
                        placeholder="Enter weight here"
                        step="0.01"
                        aria-label="Enter weight here in grams"
                        required>
                </div>

                <div class="form-group">
                    <label>Allergies (select any that apply)</label>

                    <div class="allergy-table">
                        <label>
                            <input type="checkbox" name="allergies" value="GLUTEN">
                            <span>Gluten</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="DAIRY">
                            <span>Dairy</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="NUTS">
                            <span>Nuts</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="EGGS">
                            <span>Eggs</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="FISH">
                            <span>Fish</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="PEANUTS">
                            <span>Peanuts</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="VEGAN">
                            <span>Vegan</span>
                        </label>

                        <label>
                            <input type="checkbox" name="allergies" value="VEGETARIAN">
                            <span>Vegetarian</span>
                        </label>
                    </div>
                </div>
                



                <button type="submit" class="primary-btn">Create Product</button>
                <p id="productMsg" class="text-muted"></p>
                

            </form>

        </section>

    </main>

    <div id="footer"></div>

    <script type="module" src="js/vendorHeaderFooter.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/newproduct.js"></script>

    

</body>
</html>
