<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/headerFooter.css" />
    <link rel="stylesheet" href="css/orders.css" />
</head>
<body class="orders-page">
    <!--Header-->
    <div id="header"></div>
    <div class="pageWrap">
    <main>

        <h2 id="ordersHeading">My Reservations</h2>
        <div class="orderWrapper">
            <table class="orderTable">
                <thead>
                    <!--Information shown to user about their reservations-->
                    <tr id="key">
                        <th class="r2">Bundle</th>
                        <th class="r2">Pickup Time</th>
                        <th class="r2">Vendor</th>
                        <th class="r2">Pick Up Location</th>
                        <th class="r2">Claim Code</th>
                    </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
                <!-- populated rows from backend-->
            </table>
            <p id="ordersMsg"></p>
        </div>
    </main>
    </div>
    <!--Footer-->
    <div id="footer"></div>
    
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/userHeaderFooter.js"></script>
    <script type="module" src="js/orders.js"></script>
</body>
</html>
