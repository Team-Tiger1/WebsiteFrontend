<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Last Fork</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/report.css" />
    <link rel="stylesheet" href="css/headerFooter.css" />
</head>
<body class="report-page">
    <!--Header-->
    <div id="header"></div>
    <div class="pageWrap">

    <main>
        <h2>Report an Issue</h2>
        <!--Dispute form-->
        <section class="disputForm" aria-labelledby="disputFormTitle">
            <h3 id="formTitle">Submit a Dispute</h3>
            <!--select a bundle from their orders to report/ start a dispute-->
            <label for="disputeSelect">Select a Bundle</label>
            <select name="disputeSelect" id="disputeSelect">
                <option value="">--Please choose a bundle--</option>
            </select>

            <!--Select a reason for dispute from predefined reasons-->
            <label for="reasonSelect">Select a Reason</label>
            <select name="reasonSelect" id="reasonSelect">
                <option value="">--Please choose a reason--</option>
                <option value="DAMAGED">Damaged</option>
                <option value="MISSING_ITEMS">Missing Items</option>
                <option value="QUALITY_ISSUES">Quality Issues</option>
                <option value="LOCATION_INACCESSIBLE">Location Inaccessible</option>
                <option value="VENDOR_NO_SHOW">Vendor No Show</option>
                <option value="REFUSED_COLLECTION">Refused Collection</option>
                <option value="PAST_WINDOW">Past Window</option>
                <option value="OTHER">Other</option>
            </select>
            <!--Allows the user to add context and discription to their issue/dispute especially if chosen other-->
            <label for="disputeDiscription">Description</label>
            <textarea name="disputeDiscription" id="disputeDiscription" placeholder="Describe the issue" rows="4" required aria-required="true"></textarea>

            <!--Allows the vendor to submit dispute-->
            <button id="disputeSubmitButton">Submit Dispute</button>
            <p id="disputeMsg" role="alert" aria-live="polite"></p>
        </section>

        <!--Next the current users disputs are shown-->
        <section class="dispute-list" aria-labelledby="disputeListTitle">
            <h3 id="disputeListTitle">Your Disputes</h3>
            <div id="disputeList">
                <p>Loading disputes...</p>
            </div>
        </section>
    </main>

    <!--Footer-->
    <div id="footer"></div>
    
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/userHeaderFooter.js"></script>
    <script type="module" src = "js/report.js"></script>
    </div>
</body>
</html>
