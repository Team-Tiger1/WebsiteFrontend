<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="auth-page">
  <div class="wrapper">

    <h2>Supplier Login</h2>
    <p>Access your supplier dashboard</p>
    <!--Supplier form listened to by JS for endpoints-->
    <form id="loginForm">
      <div>
        <!--Requires both a email and password-->
        <label for="email-input"><span>@</span></label>
        <!--type email so it has to be a valid email-->
        <input type="email" id="email-input" placeholder="Email" required/>
      </div>

      <div>
        <label for="password-input">🔒</label>
        <!--type password to hide text as its entered-->
        <input type="password" id="password-input" placeholder="Password" required/>
      </div>
      <!--Submits form to the supplierLogin.js-->
      <button type="submit">Login</button>
      <p id="errorMsg"></p>
    </form>

    <p>Are you a customer?<a href="login.html">Customer login</a></p>
    <p>New supplier?<a href="supplierRegister.html">Create supplier account</a></p>
  </div>

  <script type="module" src="js/supplierLogin.js"></script>
</body>
</html>
