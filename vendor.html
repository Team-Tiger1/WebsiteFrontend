<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Last Fork</title>
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/vendorStyle.css">
  <link rel="stylesheet" href="css/headerFooter.css"/>
</head>
<body>
  <div id="header"></div>
  <div class="vendorBody">
<!--To display the vendors information-->
    <h1 id="vendorName" style="text-align: start">Company Name</h1>
    <p id="vendorDescription"></p>

    <h2>Contact Details</h2>
    <div class="detail-line">
      <p>Phone Number: </p><p id="phoneNumber"></p>
    </div>
    <div class="detail-line">
      <p>Email Address: </p><p id="emailAddress"></p>
    </div>

    <h2>Location</h2>
    <div class="detail-line">
      <p>Street Address: </p><p id="streetAddress"></p>
    </div>
    <div class="detail-line">
      <p>Postcode: </p><p id="postcode"></p>
    </div>

    <!--
Source - https://stackoverflow.com/a/54265181
Posted by Syfer, modified by community. See post 'Timeline' for change history
Retrieved 2026-01-28, License - CC BY-SA 4.0
-->
    <iframe id="map" width="50%" height="300" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"></iframe><br />
    <div class="row">
      <h2 style="margin-top: 40px">Bundles</h2>
      <!--This allows the user to sort the bundles from low to high based off price-->
      <button id="sortButton">Sort Low-High <span>↕</span></button>
    </div>

    <div id="bundles-container"></div>


  </div>
  <!--If the users select the reserve button it shows them the reserve pop-up-->
  <dialog id="reservePopup">
    <h3>Confirm Reservation</h3>
    <p id="reserveDetails"></p>
    <div class="reservationBtn">
      <button id="confirmReserveBtn">Confirm</button>
      <button id="cancelReserveBtn">Cancel</button>
    </div>
  </dialog>

  <div id="footer"></div>

  <script type="module" src="js/vendor.js"></script>
  <script type="module" src="js/userHeaderFooter.js"></script>

</body>
</html>
